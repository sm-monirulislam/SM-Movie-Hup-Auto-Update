name: Latest Movie Scraper

on:
  schedule:
    - cron: "0 */3 * * *" # প্রতি ৩ ঘণ্টা পর পর রান হবে
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-playlist-update
  cancel-in-progress: false

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Fetch Python Script from Private Repo
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/sm-monirulislam/$REPO_NAME.git private_code
          cp private_code/movie/New_Movie.py ./
          rm -rf private_code

      - name: Run Scraper Script
        run: python New_Movie.py

      - name: Clean Up Python Script
        run: rm -f New_Movie.py

      - name: Commit and Push M3U Files
        shell: bash
        run: |
          # [Fixed] ফাইল নেম পরিবর্তন করে পাইথন স্ক্রিপ্টের সাথে মিল রেখে latest_movies.m3u করা হলো
          if [ ! -f "latest_movies.m3u" ]; then
            echo "latest_movies.m3u not found, skipping commit."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # সুনির্দিষ্টভাবে শুধু m3u ফাইলটি যোগ করা হচ্ছে যাতে ডিলিট হওয়া New_Movie.py গিটে পুশ না হয়
          git add "latest_movies.m3u"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🎬 Auto Update Movie Playlist [$(date '+%Y-%m-%d %H:%M:%S UTC')]"
          git push origin main
