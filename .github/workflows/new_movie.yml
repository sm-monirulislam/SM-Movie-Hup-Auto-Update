name: Latest Movie Scraper

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Public Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper beautifulsoup4

    - name: Fetch Python Script from Private Repo
      env:
        REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
      run: |
        git clone https://${{ secrets.GH_PAT }}@github.com/sm-monirulislam/$REPO_NAME.git private_code
        cp private_code/movie/New_Movie.py ./
        rm -rf private_code

    - name: Run Scraper Script
      run: python New_Movie.py

    - name: Clean up Python Script
      run: rm -f New_Movie.py

    - name: Commit and Push M3U Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add "All Movie.m3u"

        if git
