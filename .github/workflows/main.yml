name: FibWatch Auto Playlist Update

on:
schedule:
- cron: "0 */12 * * *"  # প্রতি 12 ঘণ্টা পর রান হবে
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: 📥 Checkout Repository
    uses: actions/checkout@v4

  - name: 🐍 Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: 📦 Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install cloudscraper beautifulsoup4 requests

  - name: 🚀 Run Scraper
    run: |
      python Ck.py

  - name: 📤 Commit Updated Playlists
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add playlist.m3u bangla.m3u

      git diff --cached --quiet || git commit -m "🔄 Auto Update Playlists"

  - name: 🚀 Push Changes
    uses: ad-m/github-push-action@master
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      branch: main
