name: Auto Movie Scraper

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬টায় (UTC 00:00) অটোমেটিক রান হবে
    - cron: '0 0 * * *'
  workflow_dispatch: # এর মাধ্যমে আপনি গিটহাবে গিয়ে ম্যানুয়ালিও রান করতে পারবেন

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    # ১. রিপোজিটরি চেকআউট করা
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. পাইথন সেটআপ করা
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ৩. ডিপেন্ডেন্সি ইনস্টল করা
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ৪. আপনার স্ক্রিপ্টটি রান করা (ধরে নেওয়া হয়েছে ফাইলের নাম scraper.py)
    - name: Run Scraper Script
      run: python scraper.py

    # ৫. নতুন জেনারেট হওয়া M3U ফাইল গিটহাবে পুশ/আপডেট করা
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u bangla.m3u
        
        # যদি ফাইলে কোনো পরিবর্তন না থাকে তবে এরর এড়ানোর জন্য কন্ডিশন
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Auto-updated M3U Playlists [$(date)]" && git push)
