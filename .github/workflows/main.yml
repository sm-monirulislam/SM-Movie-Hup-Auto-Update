name: Auto Movie Scraper

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬টায় (UTC 00:00) অটোমেটিক রান হবে
    - cron: '0 0 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার অপশন

# ⚡ এটি গিটহাব বটের রাইট পারমিশন (Error 403) ফিক্স করবে
permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    # ১. রিপোজিটরি চেকআউট করা
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. পাইথন সেটআপ করা
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ৩. ডিপেন্ডেন্সি সরাসরি ইনস্টল করা (requirements.txt ফাইল না থাকলেও এরর আসবে না)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper beautifulsoup4

    # ৪. আপনার স্ক্রিপ্টটি রান করা (আপনার ফাইলের নাম অনুযায়ী scraper.py রাখা হয়েছে)
    - name: Run Scraper Script
      run: python scraper.py

    # ৫. নতুন জেনারেট হওয়া M3U ফাইল গিটহাবে পুশ/আপডেট করা
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # ফাইল দুটি গিট ট্র্যাকিংয়ে অ্যাড করা
        git add playlist.m3u bangla.m3u
        
        # যদি ফাইলে কোনো পরিবর্তন না থাকে তবে এরর এড়ানোর কন্ডিশন
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Auto-updated M3U Playlists [$(date)]" && git push)
