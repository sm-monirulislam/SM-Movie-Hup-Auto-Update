name: Generate Movie Series Playlist

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Python Script from Private Repo
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          cp private_code/movie/sm_movie_web.py .
          rm -rf private_code

      - name: Run Python Script
        run: python sm_movie_web.py

      - name: Remove Python Script
        run: rm -f sm_movie_web.py

      - name: Commit and Push Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie_series.m3u
          git diff --cached --quiet || git commit -m "Update movie series playlist"
          git push
