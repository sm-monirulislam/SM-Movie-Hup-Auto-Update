name: Movie Combined Playlist

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Combine Playlists
        run: |
          python << 'EOF'
          import os

          files = [
              "All Movie.m3u",
              "Ott_Bnagla.m3u",
              "sm_movie2.m3u"
          ]

          with open("Movie_Combined.m3u", "w", encoding="utf-8") as out:
              # প্রথমে একটি মাত্র #EXTM3U হেডার
              out.write("#EXTM3U\n")

              for file in files:
                  if not os.path.isfile(file):
                      print(f"ERROR: File not found - {file}")
                      continue

                  with open(file, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()

                  if not lines:
                      continue

                  # প্রথম লাইন #EXTM3U হলে সেটা স্কিপ করো, নয়তো পুরো ফাইল বসাও
                  start_idx = 1 if lines[0].strip() == "#EXTM3U" else 0

                  for line in lines[start_idx:]:
                      out.write(line.rstrip('\n') + "\n")  # সব লাইন ঠিকভাবে বসবে

                  print(f"Added: {file}")

          print("Movie_Combined.m3u created successfully")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Movie_Combined.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Movie_Combined.m3u"
            git push
          fi
