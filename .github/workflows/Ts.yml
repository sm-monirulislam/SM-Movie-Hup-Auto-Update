name: Fibwatch Latest Movies Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install cloudscraper beautifulsoup4

      - name: Run Scraper
        run: |
          python New_Movie.py

      - name: Commit Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ফিক্স ১: ফাইলের নামে স্পেস থাকায় ডাবল কোটেশন ("") ব্যবহার করা হয়েছে
          git add "All Movie.m3u"
          
          # ফিক্স ২: মেসেজ আপডেট করা হয়েছে
          git commit -m "Updated All Movie playlist" || echo "No changes to commit"
          
          # ফিক্স ৩: টোকেন সহ নিরাপদ পুশ কনফিগারেশন
          git push origin HEAD:${{ github.ref }}
