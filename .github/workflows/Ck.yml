name: Bongo Free Data Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 🚀 Run Scraper Script
        run: |
          chmod +x scraper.sh
          ./scraper.sh

      - name: 📤 Commit & Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bongo_free_data.json

          git commit -m "Updated Bongo free data - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          git push
